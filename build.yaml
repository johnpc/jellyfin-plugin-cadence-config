changelog: >
  Storyteller: admin-managed accounts. The dashboard stores a Storyteller admin login and lists every
  Jellyfin user; users with no account get one created automatically on first use, or the admin maps
  them to an existing Storyteller account. No per-user setup in Cadence. Admin-only endpoints under
  /Cadence/Storyteller/Admin; tokens and generated passwords never leave the server.
