name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "manifest.json"
      - "**.md"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore jellyfin-plugin-cadence-config.sln

    - name: Check formatting
      run: dotnet format jellyfin-plugin-cadence-config.sln --verify-no-changes

    - name: Build (strict)
      run: dotnet build jellyfin-plugin-cadence-config.sln --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Run unit tests with coverage
      run: |
        dotnet test Jellyfin.Plugin.CadenceConfig.Tests/Jellyfin.Plugin.CadenceConfig.Tests.csproj \
          --configuration Release \
          --no-build \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=json \
          /p:CoverletOutput=../coverage/coverage.json \
          /p:Include="[Jellyfin.Plugin.CadenceConfig]*" \
          /p:ThresholdType=line \
          /p:Threshold=80

    - name: CRAP score check
      run: bash scripts/check-crap.sh coverage/coverage.json

    - name: Line count check
      run: bash scripts/check-line-count.sh 250

  release:
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Get next version
      id: get_version
      run: |
        LATEST=$(git tag --sort=-v:refname | head -1 | sed 's/^v//')
        if [ -z "$LATEST" ]; then
          LATEST="0.0.0.0"
        fi
        NEXT=$(echo "$LATEST" | awk -F. '{$NF=$NF+1; print}' OFS=.)
        echo "VERSION=$NEXT" >> $GITHUB_OUTPUT
        echo "Next version: $NEXT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Jellyfin.Plugin.CadenceConfig/Jellyfin.Plugin.CadenceConfig.csproj

    - name: Build release
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        dotnet build Jellyfin.Plugin.CadenceConfig/Jellyfin.Plugin.CadenceConfig.csproj --configuration Release --no-restore \
          /p:TreatWarningsAsErrors=true \
          /p:Version=$VERSION \
          /p:AssemblyVersion=$VERSION \
          /p:FileVersion=$VERSION

    - name: Create release zip
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        mkdir -p release
        find Jellyfin.Plugin.CadenceConfig -path "*/bin/Release/net10.0/*.dll" -exec cp {} release/ \;
        cd release
        zip -r ../jellyfin-plugin-cadence-config-${VERSION}.zip .

    - name: Calculate checksum
      id: calculate_checksum
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        CHECKSUM=$(md5sum jellyfin-plugin-cadence-config-${VERSION}.zip | awk '{ print $1 }')
        echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT

    # Git is the source of truth for the accumulated version history: the new
    # entry is prepended to the manifest.json already in this checkout. The
    # previous manifest is never fetched over the network.
    - name: Update manifest.json (accumulating all versions)
      run: |
        python3 scripts/update-manifest.py \
          --version ${{ steps.get_version.outputs.VERSION }} \
          --checksum ${{ steps.calculate_checksum.outputs.CHECKSUM }}

    - name: Validate manifest.json
      run: |
        python3 scripts/validate-manifest.py \
          --new-version ${{ steps.get_version.outputs.VERSION }} \
          --zip jellyfin-plugin-cadence-config-${{ steps.get_version.outputs.VERSION }}.zip

    # manifest.json is still attached to the release for back-compat; the
    # canonical copy is the one committed to main.
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        files: |
          jellyfin-plugin-cadence-config-${{ steps.get_version.outputs.VERSION }}.zip
          manifest.json
        generate_release_notes: true

    - name: Verify published asset matches manifest checksum
      run: |
        SOURCE_URL=$(python3 -c 'import json; v = json.load(open("manifest.json"))[0]["versions"][0]; print(v["sourceUrl"])')
        EXPECTED=$(python3 -c 'import json; v = json.load(open("manifest.json"))[0]["versions"][0]; print(v["checksum"])')
        curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors "$SOURCE_URL" -o published.zip
        ACTUAL=$(md5sum published.zip | awk '{ print $1 }')
        echo "expected: $EXPECTED"
        echo "actual:   $ACTUAL"
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::Published asset md5 does not match the manifest entry"
          exit 1
        fi

    # Pushed with the default GITHUB_TOKEN as github-actions[bot]; such pushes
    # do not retrigger workflows (and paths-ignore covers manifest.json anyway).
    - name: Commit manifest to main
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add manifest.json
        git diff --cached --quiet || git commit -m "chore: record ${{ steps.get_version.outputs.VERSION }} in plugin manifest"
        git push origin HEAD:main
